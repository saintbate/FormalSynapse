name: fsyn-gate
description: Prove an SVA against a DUT with sby, check vacuity, and score mutation kill
inputs:
  source:
    description: Path to a FormalSynapse checkout
    default: "."
  dut:
    description: DUT Verilog/SystemVerilog file
    required: true
  sva:
    description: Candidate SVA file
    required: true
  top:
    description: Top module name
    required: true
  extra:
    description: Extra compile units, whitespace/newline separated (optional)
    default: ""
  params:
    description: >-
      Top-level parameter overrides, NAME=VALUE whitespace/newline separated (yosys chparam).
      Use it when the shipped parameters put the DUT's behavior outside any affordable BMC
      bound; the report states the values the result holds for.
    default: ""
  min-kill:
    description: Minimum mutation-kill rate (0–1)
    default: "0"
  depth:
    description: BMC depth
    default: "20"
  timeout:
    description: sby timeout in seconds
    default: "180"
  max-mutants:
    description: Mutants to score
    default: "8"
  trusted:
    description: Allow `assume property` / fsyn:verbatim in the SVA (hand-written blocks only)
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"
    - uses: actions/cache@v4
      id: cache-suite
      with:
        path: ~/.local/opt/oss-cad-suite
        key: oss-cad-suite-2026-08-31-${{ runner.os }}
    - name: Install OSS CAD Suite
      if: steps.cache-suite.outputs.cache-hit != 'true'
      shell: bash
      env:
        PLATFORM: linux-x64
        RELEASE: "2026-08-31"
        FSYN_SOURCE: ${{ inputs.source }}
      run: |
        export FSYN_TOOLCHAIN_DIR="$HOME/.local/opt/oss-cad-suite"
        bash "$FSYN_SOURCE/scripts/install_toolchain.sh"
    - name: Install fsyn
      shell: bash
      env:
        FSYN_SOURCE: ${{ inputs.source }}
      run: uv sync --project "$FSYN_SOURCE"
    - name: Gate
      shell: bash
      # Inputs go through env so a path with spaces or shell metacharacters cannot be
      # interpolated into the script.
      env:
        FSYN_SOURCE: ${{ inputs.source }}
        FSYN_DUT: ${{ inputs.dut }}
        FSYN_SVA: ${{ inputs.sva }}
        FSYN_TOP: ${{ inputs.top }}
        FSYN_EXTRA: ${{ inputs.extra }}
        FSYN_PARAMS: ${{ inputs.params }}
        FSYN_DEPTH: ${{ inputs.depth }}
        FSYN_TIMEOUT: ${{ inputs.timeout }}
        FSYN_MIN_KILL: ${{ inputs.min-kill }}
        FSYN_MAX_MUTANTS: ${{ inputs.max-mutants }}
        FSYN_TRUSTED: ${{ inputs.trusted }}
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/opt/oss-cad-suite/bin:$PATH"
        args=()
        for f in $FSYN_EXTRA; do
          args+=(--extra "$f")
        done
        for p in $FSYN_PARAMS; do
          args+=(--param "$p")
        done
        if [[ "$FSYN_TRUSTED" == "true" ]]; then
          args+=(--trusted)
        fi
        uv run --project "$FSYN_SOURCE" fsyn gate \
          --dut "$FSYN_DUT" \
          --sva "$FSYN_SVA" \
          --top "$FSYN_TOP" \
          --depth "$FSYN_DEPTH" \
          --timeout "$FSYN_TIMEOUT" \
          --min-kill "$FSYN_MIN_KILL" \
          --max-mutants "$FSYN_MAX_MUTANTS" \
          --markdown "${GITHUB_STEP_SUMMARY:-fsyn-gate-summary.md}" \
          "${args[@]}"
