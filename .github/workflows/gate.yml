name: fsyn-gate

# Runs the open sby gate on the golden counter and on one external DUT
# (ben-marshall/uart transmitter). External repos: checkout FormalSynapse
# into `.fsyn` and `uses: ./.fsyn/.github/actions/fsyn-gate` with dut/sva/top.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  counter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fsyn-gate
        with:
          dut: benchmarks/golden/counter/counter.sv
          sva: benchmarks/golden/counter/counter.sva.sv
          top: counter
          min-kill: "0.75"

  uart_tx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ben-marshall/uart
          ref: 5fd2db850a41b65aa34f3a31c663fc8704c7abd8
          path: .dut
      # Parameter-agnostic block at the shipped parameters: prove + cover only (kill is 0/8
      # there and the SVA header says why).
      - uses: ./.github/actions/fsyn-gate
        with:
          dut: .dut/rtl/uart_tx.v
          sva: examples/uart_tx/uart_tx.sva.sv
          top: uart_tx
          timeout: "180"
      # Frame-timing block, elaborated at 3 clocks/bit with a 2-bit payload so a frame fits a
      # 30-step bound; gated on kill rate.
      - uses: ./.github/actions/fsyn-gate
        with:
          dut: .dut/rtl/uart_tx.v
          sva: examples/uart_tx/uart_tx_frame.sva.sv
          top: uart_tx
          params: "BIT_RATE=25000000 PAYLOAD_BITS=2"
          depth: "30"
          min-kill: "0.5"
          timeout: "180"
