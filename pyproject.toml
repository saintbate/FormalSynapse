[project]
name = "formalsynapse"
version = "0.1.0"
description = "Neuro-symbolic SVA synthesis and verification harness (Yosys + SymbiYosys + SMT)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
fsyn = "formalsynapse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formalsynapse"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tools", "work", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["formalsynapse", "tests"]
exclude = ["tools/", "work/", "output/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "toolchain: requires the OSS CAD Suite (sby/yosys) on PATH; skipped when missing",
    "llm: requires a live OpenAI-compatible LLM endpoint",
]
addopts = "-ra"
